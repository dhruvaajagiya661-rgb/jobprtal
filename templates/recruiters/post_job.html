{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-professional p-5">
                    <div class="mb-4">
                        <h2 class="fw-bold">Post a New Opportunity</h2>
                        <p class="text-secondary">Fill in the details to reach thousands of talented students and job seekers.</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            {% for field in form %}
                            <div class="{% if field.name == 'description' or field.name == 'requirements' %}col-12{% else %}col-md-6{% endif %}">
                                <label class="form-label small fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small">{{ field.errors }}</div>
                                {% endif %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="mt-4 d-flex gap-3">
                            <button type="submit" class="btn btn-primary-custom px-5 py-2">Publish Job</button>
                            <a href="{% url 'recruiter_dashboard' %}" class="btn btn-light px-5 py-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
