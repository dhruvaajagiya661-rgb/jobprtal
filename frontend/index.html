<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PortAL | Internships & Graduate Jobs with Explainable Match Scores</title>
    <meta
      name="description"
      content="PortAL connects students with internships and graduate jobs. See exactly why each role matches you, close your skill gaps, and track every application in one place."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="PortAL" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PortAL" />
    <meta property="og:title" content="PortAL | Internships & Graduate Jobs" />
    <meta
      property="og:description"
      content="Find internships and graduate jobs, see exactly why each one matches you, and track every application in one place."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PortAL — find your internship, know why it fits" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PortAL | Internships & Graduate Jobs" />
    <meta
      name="twitter:description"
      content="Find internships and graduate jobs, see exactly why each one matches you, and track every application in one place."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Fonts: preconnect so the stylesheet request starts before the parser reaches it -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "PortAL",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "description": "An internship and graduate job portal with explainable match scores and skill-gap planning."
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "PortAL",
            "publisher": { "@id": "%SITE_URL%/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "%SITE_URL%/jobs?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>PortAL</h1>
        <p>PortAL needs JavaScript enabled to browse internships and jobs. Please turn it on and reload.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
