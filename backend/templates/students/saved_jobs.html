{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-10 mx-auto">
            <h2 class="fw-bold mb-4">Saved Jobs</h2>
            <div class="row g-4">
                {% for saved in saved_jobs %}
                <div class="col-md-6">
                    <div class="card card-professional p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="d-flex align-items-center">
                                <div class="bg-light p-3 rounded-3 me-3">
                                    <i class="fas fa-building text-primary"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1"><a href="{% url 'job_detail' saved.job.id %}" class="text-dark text-decoration-none">{{ saved.job.title }}</a></h6>
                                    <p class="text-secondary small mb-0">{{ saved.job.company.name }}</p>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <p class="text-secondary small mb-0">Saved on {{ saved.saved_at|date:"M d, Y" }}</p>
                            <a href="{% url 'job_detail' saved.job.id %}" class="btn btn-primary-custom btn-sm px-4">View</a>
                        </div>
                    </div>
                </div>
                {% empty %}
                <div class="col-12 text-center py-5">
                    <i class="fas fa-bookmark fa-3x mb-3 text-light"></i>
                    <p class="text-secondary">No saved jobs yet. <a href="{% url 'job_list' %}">Explore jobs</a></p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
